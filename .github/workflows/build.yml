name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags:     ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    name: Cross-compile → Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: go/go.sum

      - name: Build polymorphic-demo.exe
        working-directory: go
        env:
          GOOS:   windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o ../polymorphic-demo.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: polymorphic-demo-windows-x64
          path: polymorphic-demo.exe
          retention-days: 30

      # Create a GitHub Release and attach the EXE when a version tag is pushed
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: polymorphic-demo.exe
          body: |
            ## Polymorphic Malware Behavior Simulator ${{ github.ref_name }}

            Windows x64 compiled binary — built automatically from Go source.

            ### Usage
            ```
            polymorphic-demo.exe                  # run all modules (as Administrator)
            polymorphic-demo.exe -no-inject        # skip injection (non-admin)
            polymorphic-demo.exe -interval 15      # beacon every 15 seconds
            polymorphic-demo.exe -cleanup          # remove all artifacts
            ```

            See `README.md` and `demo-script.pdf` for full instructions.

            **FOR AUTHORIZED SECURITY TESTING ONLY**
